# Background phase (paused): runs on the SAME VM as stock-ai, as its own Compose
# project. The project name comes from the folder (~/fantasy-analysis), so the
# two stacks never share networks or names. See DEPLOY.md.
services:
  ffai:
    build: .
    # stock-ai uses stock-ai-monitor and stock-ai-api, so no clash.
    container_name: ffai-monitor
    restart: unless-stopped
    env_file: .env
    environment:
      - FFAI_DB_PATH=/data/ffai.db
      - TZ=America/Denver
    volumes:
      # Own data folder inside this clone, separate from stock-ai's ./data.
      - ./data:/data
    # The VM has 1 GB of RAM and stock-ai is already on it. A leak here must
    # not starve stock-ai.
    mem_limit: 256m
    # No ports: 8000 is stock-ai's API, and ffai only makes outbound requests.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
