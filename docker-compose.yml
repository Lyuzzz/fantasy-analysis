# Background phase (paused). The service runs on the SAME VM as stock-ai.
# It is its own Compose project. The project name comes from the folder (~/fantasy-analysis).
# The two stacks therefore never share networks or names. See DEPLOY.md.
services:
  ffai:
    build: .
    # stock-ai uses the names stock-ai-monitor and stock-ai-api, so the names do not clash.
    container_name: ffai-monitor
    restart: unless-stopped
    env_file: .env
    environment:
      - FFAI_DB_PATH=/data/ffai.db
      - TZ=America/Denver
    volumes:
      # ffai has its own data folder inside its own clone. It is separate from ./data of stock-ai.
      - ./data:/data
    # The VM has 1 GB of RAM, and stock-ai already runs on it.
    # A memory leak in ffai must not starve stock-ai.
    mem_limit: 256m
    # No ports. Port 8000 belongs to the API of stock-ai, and ffai only makes outbound requests.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
