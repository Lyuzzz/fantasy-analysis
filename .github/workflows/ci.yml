name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      # This step finds syntax errors and undefined names only. stock-ai uses the same rule set.
      - run: ruff check --select E9,F63,F7,F82 ffai tests
      # Import every module once. This step finds a broken import that no test touches.
      - run: python -c "import ffai.cli, ffai.espn_client, ffai.parser, ffai.lineup, ffai.analysis, ffai.alerts, ffai.scheduler, ffai.ai, ffai.pipeline, ffai.service, ffai.constants"
      - run: pytest tests -q
      # The extension has no build step. This step checks only that the manifest is valid JSON.
      - run: python -c "import json; json.load(open('extension/manifest.json'))"

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t ffai .
